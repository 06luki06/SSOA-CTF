<!-- templates/profile.html -->
<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/public/css/styles.css">
    <script src="/public/js/admin.js" defer></script>
</head>

<body>
<div class="bg-img-container">
    <img src="/public/img/bg-img.jpg" alt="Background" class="bg-img">
</div>
<div class="card-container">
    <div class="card">
        <h2>Profile</h2>
        <p class="greeting">Welcome, {{ username }}</p>
        <form action="/logout" method="post">
            <button type="submit" class="btn-primary">
                Logout
            </button>
        </form>
    </div>
    <div class="card" id="employeeSearch">
        <h2>Admin Stuff</h2>
        <div class="checkbox-wrapper">
            <input id="check_burns" class="checkbox" type="checkbox" {% if check_burns %} checked {% endif %}/>
            <div class="checkbox-label">Confirmed Burns</div>
        </div>
        <div class="checkbox-wrapper">
            <input id="check_mayor" class="checkbox" type="checkbox" {% if check_mayor %} checked {% endif %} disabled/>
            <div class="checkbox-label">Confirmed Mayor</div>
        </div>
        Task: Eliminate competitors
        <a href="/admin/nuke">
            <button class="btn-danger" {% if not check_burns or not check_mayor %} disabled {% endif %}>Decimate
                Shelbyville
            </button>
        </a>
    </div>

    <div class="card">
        <h2>Add new Employee</h2>
        <div class="status"></div>
        <div class="input-group">
            <label for="employeeFirstName">First Name</label>
            <input type="text" id="employeeFirstName" name="employeeFirstName" required>
        </div>
        <div class="input-group">
            <label for="employeeLastName">Last Name</label>
            <input type="text" id="employeeLastName" name="employeeLastName" required>
        </div>
        <div class="input-group">
            <label for="employeePassword">Password</label>
            <input type="password" id="employeePassword" name="employeePassword" required>
        </div>
        <button type="submit" class="btn-primary" id="addEmployeeBtn">
            Add Employee
        </button>
    </div>
</div>
</body>

</html>
